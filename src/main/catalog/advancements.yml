          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:the_end
                position: { x: { min: 10000 } }
      west:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:the_end
                position: { x: { max: -10000 } }
      south:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:the_end
                position: { z: { min: 10000 } }
      north:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
