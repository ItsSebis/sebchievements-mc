# Single source of truth for every advancement. See CLAUDE.md section 2.1.
#
# Per entry:
#   id, tab, parent (default: root of the tab), title, description, icon, frame (task|goal|challenge),
#   hidden (default false), mode (vanilla|plugin)
#   mode vanilla: criteria (inline datapack criteria), optional requirements (list of OR-groups)
#   mode plugin:  optional criteria (list of criterion names, default [done])
#   kind (timed|streak|counter): needs anti_cheese, and its handler must implement ProgressReporting
#
# Thresholds in descriptions must match the defaults in config.yml.

tabs:
  social:      { title: "Social", icon: minecraft:cake, background: minecraft:block/oak_planks }
  silly:       { title: "Silly", icon: minecraft:carved_pumpkin, background: minecraft:block/hay_block_side }
  challenges:  { title: "Challenges", icon: minecraft:wither_skeleton_skull, background: minecraft:block/blackstone }
  exploration: { title: "Exploration", icon: minecraft:compass, background: minecraft:block/stone }

advancements:
  - id: tax_evasion
    tab: silly
    title: "Tax Evasion"
    description: "Kill a Wandering Trader"
    icon: minecraft:emerald
    frame: task
    mode: vanilla
    criteria:
      kill:
        trigger: minecraft:player_killed_entity
        conditions:
          entity:
            type: minecraft:entity_properties
            entity: this
            predicate: { minecraft:entity_type: minecraft:wandering_trader }
    difficulty: 2
    reward: [{item: "minecraft:emerald", name: "Tax Refund", reclaim: never}]

  - id: nice_to_mace_you
    tab: challenges
    title: "Nice to Mace You"
    description: "Craft a mace and hit something with a smash attack"
    icon: minecraft:mace
    frame: goal
    mode: vanilla
    # Both criteria are required (default AND). The mace_smash damage tag is the game's own
    # definition of a mace hit while falling, so fall distance needs no custom predicate.
    criteria:
      crafted_mace:
        trigger: minecraft:recipe_crafted
        conditions:
          recipes: minecraft:mace
      smash_attack:
        trigger: minecraft:player_hurt_entity
        conditions:
          damage:
            type:
              direct_entity:
                minecraft:entity_type: minecraft:player
                minecraft:equipment: { mainhand: { items: minecraft:mace } }
              tags:
                - { id: "#minecraft:mace_smash", expected: true }
    difficulty: 6
    reward: [{item: "minecraft:wind_charge", count: 4, reclaim: never}]

  - id: commuter
    tab: exploration
    title: "Commuter"
    description: "Travel 10,000 Overworld-equivalent blocks in one Nether trip"
    icon: minecraft:netherite_boots
    frame: goal
    mode: vanilla
    criteria:
      travelled:
        trigger: minecraft:nether_travel
        conditions:
          distance: { horizontal: { min: 10000 } }
    difficulty: 3
    reward: [{item: "minecraft:warped_fungus_on_a_stick", name: "Commuter Pass", reclaim: cost}]

  - id: off_the_map
    tab: exploration
    title: "Off the Map"
    description: "Reach 20,000 blocks from the origin along either axis in the Overworld"
    icon: minecraft:filled_map
    frame: goal
    mode: vanilla
    requirements: [[east, west, south, north]]
    criteria:
      east:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:overworld
                position: { x: { min: 20000 } }
      west:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:overworld
                position: { x: { max: -20000 } }
      south:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:overworld
                position: { z: { min: 20000 } }
      north:
        trigger: minecraft:location
        conditions:
          player:
            type: minecraft:entity_properties
            entity: this
            predicate:
              minecraft:location:
                dimension: minecraft:overworld
                position: { z: { max: -20000 } }
    difficulty: 5
    reward: [{item: "minecraft:recovery_compass"}]

  - id: far_end
