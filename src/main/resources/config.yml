# Sebchievements configuration.
# Thresholds for each advancement live under advancements.<id>; the descriptions in the
# in-game catalog (src/main/catalog/advancements.yml) must match these defaults.

# A player counts as AFK after this long without moving or turning meaningfully.
afk_seconds: 120

# How long RecentDamageService remembers who hit whom.
recent_damage_retention_seconds: 60

# Blocks a player placed less than this long ago don't count as mined (place-and-break loops).
placed_block_ignore_minutes: 30

# /adv rewards: after reclaiming a lost reward the same one can't be reclaimed again for this long
# (bypass with smpadv.rewards.nocooldown).
rewards:
  reclaim_cooldown_minutes: 60

advancements:
  yeet_the_goat:
    window_seconds: 10       # the goat must have been hit by the player this recently before it fell
  obsidian_obsession:
    blocks: 1000
  marathon:
    blocks: 100000           # on foot (walking or sprinting), counted from when the plugin first saw the player
  moving_mountains:
    blocks: 100000
  skull_collector:
    skulls: 50               # counted from the "picked up" statistic (at most the wither skeletons killed) once, then from drops of wither skeletons you kill
  untouchable:
    seconds: 1200
  pacifist:
    nights: 3
    night_start: 13000       # time of day, in ticks
    night_end: 23000
    slack_ticks: 40          # how late into the first tick of the night you may be first seen
  food_critic:
    window_seconds: 60
    survive_seconds: 30
    foods: [PUFFERFISH, POISONOUS_POTATO, ROTTEN_FLESH, SPIDER_EYE]
  totem_chain:
    totems: 3
    seconds: 60
  actual_sniper:
    blocks: 100
  one_man_army:
    omen_level: 5            # the highest Bad Omen level
    radius: 64
  fresh_start:
    seconds: 600
  wither_storm:
    withers: 3
    seconds: 600
  iron_will:
    seconds: 86400           # 24 hours
  frozen_human:
    seconds: 30
  free_diver:
    seconds: 120
    reset_on_surface: false  # true = must stay under continuously (practically impossible: you drown in ~15s)
  roads_were_a_mistake:
    blocks: 1000
    max_step_blocks: 150     # a jump larger than this between two checks (portal, teleport) restarts the ride
  long_way_home:
    blocks: 10000
  top_to_bottom:
    seconds: 300
    margin: 0                # blocks of leniency on both the top and the bottom threshold
  dimension_hopper:
    seconds: 600
  sky_camper:
    y: 200
    night_start: 13000       # time of day, in ticks
    night_end: 23000
    slack_ticks: 40          # a full night minus this many ticks, to absorb check timing
    max_jump_ticks: 400      # larger time jumps (sleeping, /time) are ignored
  caveman:
    ticks: 24000             # one in-game day
    max_jump_ticks: 400
  roommates:
    radius: 5
  group_project:
    radius: 16
    others: 4                # other players needed nearby; 4 = a whole group of 5
  bodyguard:
    seconds: 5
  medic:
    max_health: 8.0          # hit points; 8.0 = 4 hearts
  witness:
    radius: 16
  twinning:
    radius: 8
  dinner_party:
    players: 3
    seconds: 60
  professional_napper:
    nights: 100
  its_fine:
    seconds: 60
    max_health: 1.0          # hit points; 1.0 = half a heart
  hoarder:
    material: DIRT
  fashion_disaster:
    distinct_materials: 4
  creeper_whisperer:
    radius: 3.0
  staring_contest:
    seconds: 10
    range: 32
  one_mans_trash:
    count: 3                 # 10 in a row is about a one in ten billion chance; 3 is roughly one in a thousand catches
    junk:                    # a plain fishing rod is junk; an enchanted one is treasure and resets the streak
      - LILY_PAD
      - BOWL
      - FISHING_ROD
      - LEATHER
      - LEATHER_BOOTS
      - ROTTEN_FLESH
      - STICK
      - STRING
      - POTION
      - BONE
      - INK_SAC
      - TRIPWIRE_HOOK
